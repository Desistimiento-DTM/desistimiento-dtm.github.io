# Configuración de publicación en Netlify (se detecta automáticamente)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El panel vive en /admin/ (Netlify sirve public/admin/index.html directamente).
# Todas las demás rutas las resuelve la aplicación (/servicios, /blog/..., etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
